name: Ambient audio and phone controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/canopy.test.mjs tests/grove-floor.test.mjs
      - run: npm run test:audio
